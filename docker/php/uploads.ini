; Raises the official wordpress:php8.3-apache image's default upload limits
; (upload_max_filesize=2M, post_max_size=8M) so the plugin zip (bundles
; vendor/) and larger media/reference-design uploads don't get rejected by
; PHP before WordPress even sees them.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
